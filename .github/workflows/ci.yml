# CI pipeline for pi-secured-setup.
#
# Pipeline stages: install -> test -> type-check -> audit -> sbom
# Each stage is a separate job so failures are easy to attribute and
# downstream jobs only run when upstream succeeds (default behaviour).
#
# Notes:
#   - Node 20 LTS is pinned via setup-node.
#   - `npm ci` requires a committed package-lock.json (added in QW-2).
#   - The type-check job is a hard gate: `npx tsc --noEmit` must pass
#     with 0 errors. The pre-existing GuardVerdict.reason narrowing
#     errors in lib/guard-pipeline.ts were fixed by tightening
#     validateToolInput's return type to `{ action: "block"; reason:
#     string } | null`.
#   - The audit job is `continue-on-error: true` because transitive
#     vulnerabilities (e.g. protobufjs, undici) may be present without
#     an upstream fix available. We surface them in the run log without
#     blocking pull requests.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run test suite (tsx --test)
        run: npm test

  coverage:
    name: Coverage gate (lib/ lines >= 86%)
    runs-on: ubuntu-latest
    needs: install
    # Honest coverage gate. c8 wraps `tsx --test`, enforces a global
    # line-coverage floor scoped to lib/ via --include 'lib/**'.
    #
    # Threshold rationale: the measured coverage after P3-4 is 88.87%.
    # The gate is set to 86% — ~3 points of headroom so routine
    # refactors don't flake CI, while still bounding regression well
    # above the 80% target. Per-file numbers (audit.ts ~78%,
    # skill-scanner.ts ~74%) fall below the floor because interactive
    # command/approval handlers need a full TUI harness; the OVERALL
    # lib/ lines carry the gate. Lower this floor only if a deliberate
    # design change shrinks the reachable surface, and document why.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run test suite with coverage gate
        run: npm run test:coverage

  type-check:
    name: Type check (tsc --noEmit)
    runs-on: ubuntu-latest
    needs: install
    # Hard gate: tsc --noEmit must pass with 0 errors. The pre-existing
    # GuardVerdict.reason narrowing errors in lib/guard-pipeline.ts were
    # fixed by tightening validateToolInput's return type to
    # `{ action: "block"; reason: string } | null`.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  audit:
    name: npm audit (high)
    runs-on: ubuntu-latest
    needs: install
    # Transitive vulnerabilities may exist without an upstream fix
    # (e.g. protobufjs DoS). We surface them in the log but do not
    # block PRs. The `overrides` block in package.json pins known-bad
    # transitive packages to patched ranges where possible.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: npm audit --audit-level=high
        run: npm audit --audit-level=high

  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      # `npm sbom` is built into npm 9+ and emits CycloneDX 1.5 to stdout.
      # We redirect to bom.json and upload it as a workflow artifact.
      # If a future npm drop removes `npm sbom`, fall back to:
      #   npx --yes @cyclonedx/cyclonedx-npm --output-file bom.json
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --sbom-type application > bom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: bom.json
          if-no-files-found: error
          retention-days: 30
